services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tracemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracemind_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tracemind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracemind} -d ${POSTGRES_DB:-tracemind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracemind-network

  redis:
    image: redis:7.2-alpine
    container_name: tracemind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracemind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracemind-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracemind_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tracemind_db}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-local-dev-placeholder}
    ports:
      - "8000:8000"
    volumes:
      - uploaded_logs:/app/data/uploads
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tracemind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracemind-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - tracemind-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploaded_logs:
    driver: local

networks:
  tracemind-network:
    driver: bridge
