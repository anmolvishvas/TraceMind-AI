name: PR Audit & Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-title:
    name: Validate Conventional Commit Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            chore
          requireScope: false
          subjectPattern: ^([A-Za-z0-9]|[\s\S]+)$
          subjectPatternError: "PR title must follow Conventional Commits, e.g., 'feat: add java parser' or 'docs(architecture): update diagrams'"

  auto-label:
    name: Automatic PR Labelling
    runs-on: ubuntu-latest
    steps:
      - name: Apply Path-Based Labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
        continue-on-error: true
